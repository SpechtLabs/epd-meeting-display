name: CI

# Lints the repository and builds the firmware for every pull request and every
# push to main, and keeps each run's firmware as an artifact.
on:
  # The filter excludes rather than lists, so a new source directory or config
  # file runs CI by default.
  push:
    branches:
      - main
    paths:
      - "**"
      - "!**.md"
      - "!LICENSE.md"
      - "!stl/**"
      - "!img/**"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!LICENSE.md"
      - "!stl/**"
      - "!img/**"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Each job installs the tools listed below with mise-action's install_args.
  # Without this, `mise run` installs every tool in .mise.toml first.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  # mise itself, pinned. Unpinned, mise-action picks the newest release and
  # leaves it out of its cache key, so every new mise release finds an older
  # binary in the restored cache, warns that it failed integrity verification
  # and downloads it again.
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: 2026.10.3
  # Every tool a CI job runs, installed in every job. mise-action keys its
  # cache on install_args, so one list means one cache that main's runs save
  # and every pull request restores.
  MISE_TOOLS: python uv pipx:platformio yamllint actionlint shellcheck

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      - name: Lint YAML
        run: mise run yaml-lint

      # The matcher turns actionlint's output into annotations on the PR diff.
      # shellcheck is installed above, so the `run:` scripts are checked too.
      - name: Lint workflows
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          mise run actionlint

  build:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: ${{ env.MISE_TOOLS }}

      # The ESP32 platform, toolchain, framework and libraries that PlatformIO
      # downloads. platformio.ini pins the platform and the library ranges, so
      # it's the key: the first run after it changes saves the cache, and later
      # runs restore it.
      - name: Cache PlatformIO packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini', '.mise.toml') }}
          restore-keys: platformio-${{ runner.os }}-

      - name: Build the firmware
        run: mise run build

      - name: Upload the firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-dfrobot_firebeetle2_esp32e-${{ github.sha }}
          path: |
            .pio/build/*/*.bin
            .pio/build/*/*.elf
